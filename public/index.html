<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Job Hunter ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .btn-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); transition: all 0.3s ease; }
        .btn-gradient:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4); }
        .loading-shimmer {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .tab-active { border-bottom: 2px solid #6366f1; color: #6366f1; }
    </style>
</head>
<body class="min-h-screen py-8">
    <div class="max-w-6xl mx-auto px-4">
        <!-- Header -->
        <header class="text-center mb-12">
            <h1 class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-violet-600 mb-2">
                LinkedIn Job Hunter
            </h1>
            <p class="text-slate-500 font-medium italic">Intelligent AI-Powered Job Discovery</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- Sidebar: Controls -->
            <aside class="lg:col-span-4 space-y-6">
                <div class="glass p-6 rounded-3xl shadow-xl">
                    <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                        Search Filters
                    </h3>
                    <form id="searchForm" class="space-y-4">
                        <div>
                            <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Keywords</label>
                            <input type="text" name="keyword" value="TypeScript, React" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Location</label>
                            <input type="text" name="location" value="London" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Limit</label>
                                <input type="number" name="limit" value="50" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Date Posted</label>
                                <select name="dateSincePosted" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                                    <option value="past Week">Past Week</option>
                                    <option value="24hr">Past 24H</option>
                                    <option value="past Month">Past Month</option>
                                    <option value="">Anytime</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Experience Level</label>
                            <select name="experienceLevel" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                                <option value="">Any</option>
                                <option value="internship">Internship</option>
                                <option value="entry level">Entry Level</option>
                                <option value="associate" selected>Associate</option>
                                <option value="senior">Senior</option>
                            </select>
                        </div>
                        <button type="submit" id="submitBtn" class="w-full btn-gradient py-3 rounded-xl text-white font-bold shadow-lg shadow-indigo-200 flex items-center justify-center gap-2">
                            <span>Search Jobs</span>
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </button>
                    </form>
                </div>

                <div id="statusBox" class="hidden glass p-4 rounded-2xl border-l-4 border-indigo-500 flex items-center gap-3">
                    <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-indigo-500"></div>
                    <span id="statusText" class="text-sm font-semibold text-slate-600">Initializing...</span>
                </div>
            </aside>

            <!-- Main Content: Results -->
            <main class="lg:col-span-8 space-y-8">
                <!-- Search Goal Placeholder -->
                <div id="searchGoal" class="hidden">
                    <!-- Dynamic Search Goal Content -->
                </div>

                <!-- Tabs -->
                <div class="flex gap-6 border-b border-slate-200 mb-6 items-center justify-between">
                    <div class="flex gap-6">
                        <button id="tabTopPicks" class="tab-active pb-3 text-sm font-bold flex items-center gap-2 transition-all">
                            ✨ Top Picks <span id="countTopPicks" class="bg-indigo-100 text-indigo-600 px-2 py-0.5 rounded-full text-[10px]">0</span>
                        </button>
                        <button id="tabAllJobs" class="pb-3 text-sm font-bold text-slate-400 flex items-center gap-2 transition-all">
                            All Results <span id="countAllJobs" class="bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full text-[10px]">0</span>
                        </button>
                    </div>
                </div>

                <!-- Results Table -->
                <div class="bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
                    <div id="resultsContent">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left">
                                <thead class="bg-slate-50 border-b border-slate-100">
                                    <tr>
                                        <th class="px-6 py-4 text-[10px] font-black uppercase tracking-widest text-slate-400">
                                            <div class="flex items-center justify-between gap-4">
                                                <span>Position</span>
                                                <!-- Strict Mode Toggle relocated here -->
                                                <div id="strictModeToggleContainer" class="flex items-center gap-3">
                                                    <span class="text-[8px] font-black text-slate-400 uppercase tracking-[0.2em]">Strict Mode</span>
                                                    <button id="strictToggle" class="w-8 h-4 bg-indigo-600 rounded-full relative transition-colors duration-300 focus:outline-none">
                                                        <div id="strictToggleKnob" class="absolute left-4 top-0.5 w-3 h-3 bg-white rounded-full transition-all duration-300 shadow-sm"></div>
                                                    </button>
                                                </div>
                                            </div>
                                        </th>
                                        <th class="px-6 py-4 text-[10px] font-black uppercase tracking-widest text-slate-400">Company</th>
                                        <th class="px-6 py-4 text-[10px] font-black uppercase tracking-widest text-slate-400">Location</th>
                                        <th class="px-6 py-4 text-[10px] font-black uppercase tracking-widest text-slate-400 text-center">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="resultsBody" class="divide-y divide-slate-50">
                                    <tr><td colspan="4" class="px-6 py-12 text-center text-slate-400">Search for jobs to see results...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Script Area -->
    <script>
        const searchForm = document.getElementById('searchForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusBox = document.getElementById('statusBox');
        const statusText = document.getElementById('statusText');
        const searchGoal = document.getElementById('searchGoal');
        const resultsBody = document.getElementById('resultsBody');
        const countTopPicks = document.getElementById('countTopPicks');
        const countAllJobs = document.getElementById('countAllJobs');

        let currentData = { allJobs: [], topPicks: [], goal: { summary: "", titles: [] } };
        let activeTab = 'topPicks';
        let isStrictMode = true;

        searchForm.onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(searchForm);
            const queryOptions = Object.fromEntries(formData.entries());

            // UI Reset
            submitBtn.disabled = true;
            statusBox.classList.remove('hidden');
            searchGoal.classList.add('hidden');
            statusText.innerText = "Crawling LinkedIn...";
            resultsBody.innerHTML = `<tr><td colspan="4" class="px-6 py-12 text-center"><div class="loading-shimmer h-4 w-64 mx-auto rounded"></div></td></tr>`;

            try {
                const response = await axios.post('/api/search', queryOptions);
                const data = response.data;
                currentData = data;
                
                // Render UI
                renderSearchGoal(data.goal);
                renderJobs();
            } catch (error) {
                alert('Error: ' + error.message);
                resultsBody.innerHTML = `<tr><td colspan="4" class="px-6 py-12 text-center text-red-500">Failed to fetch jobs. Please try again.</td></tr>`;
            } finally {
                submitBtn.disabled = false;
                statusBox.classList.add('hidden');
            }
        };

        function renderSearchGoal(goal) {
            if (!goal || !goal.summary) return;
            searchGoal.innerHTML = `
                <div class="mb-8 p-8 bg-gradient-to-br from-indigo-600 via-indigo-700 to-violet-800 rounded-[2rem] shadow-2xl border border-white/10 text-white overflow-hidden relative group">
                    <!-- Decorative background element -->
                    <div class="absolute -right-20 -top-20 w-64 h-64 bg-white/5 rounded-full blur-3xl group-hover:bg-white/10 transition-colors duration-700"></div>
                    
                    <div class="relative z-10">
                        <div class="flex items-center gap-4 mb-6">
                            <div class="bg-white/10 p-3 rounded-2xl backdrop-blur-md border border-white/20">
                                <svg class="w-6 h-6 text-indigo-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </div>
                            <div>
                                <h4 class="text-indigo-100 text-[10px] font-black uppercase tracking-[0.3em]">AI Search Strategist</h4>
                                <p class="text-xs text-indigo-200/70 font-medium">Goal Analysis Complete</p>
                            </div>
                        </div>

                        <div class="space-y-6">
                            <div>
                                <p class="text-xl font-medium leading-relaxed text-indigo-50">${goal.summary}</p>
                            </div>

                            ${goal.titles && goal.titles.length > 0 ? `
                            <div class="pt-6 border-t border-white/10">
                                <p class="text-[10px] font-bold text-indigo-300 uppercase tracking-widest mb-4">Recommended Job Titles</p>
                                <div class="flex flex-wrap gap-2">
                                    ${goal.titles.map(title => `
                                        <span class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-xl text-sm font-semibold border border-white/10 transition-all cursor-default backdrop-blur-sm">
                                            ${title}
                                        </span>
                                    `).join('')}
                                </div>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
            searchGoal.classList.remove('hidden');
        }

        function renderJobs() {
            const toggleContainer = document.getElementById('strictModeToggleContainer');
            if (activeTab === 'topPicks') {
                toggleContainer.classList.remove('invisible');
            } else {
                toggleContainer.classList.add('invisible');
            }

            let jobs = activeTab === 'topPicks' ? currentData.topPicks : currentData.allJobs;
            
            // Client-side Strict Mode filtering
            if (activeTab === 'topPicks' && isStrictMode) {
                jobs = jobs.filter(j => j.isVetted);
            }

            countTopPicks.innerText = currentData.topPicks.filter(j => isStrictMode ? j.isVetted : true).length;
            countAllJobs.innerText = currentData.allJobs.length;

            if (jobs.length === 0) {
                resultsBody.innerHTML = `<tr><td colspan="4" class="px-6 py-12 text-center text-slate-400">No jobs found in this category. ${isStrictMode && activeTab === 'topPicks' ? 'Try turning off Strict Mode!' : ''}</td></tr>`;
                return;
            }

            resultsBody.innerHTML = jobs.map(job => `
                <tr class="hover:bg-indigo-50/30 transition-colors ${!job.isVetted && activeTab === 'topPicks' ? 'opacity-70 bg-slate-50/30' : ''}">
                    <td class="px-6 py-5">
                        <div class="flex items-center gap-2">
                            <div class="font-bold text-slate-800">${job.position}</div>
                            ${job.isVetted ? '<span class="text-[8px] bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded font-black uppercase tracking-tighter">Vetted</span>' : ''}
                        </div>
                        <div class="text-[10px] text-slate-400 mt-1 uppercase font-semibold tracking-wider">${job.agoTime || ''}</div>
                    </td>
                    <td class="px-6 py-5 text-slate-600 font-medium">${job.company}</td>
                    <td class="px-6 py-5">
                        <span class="bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full text-xs font-bold border border-indigo-100">${job.location}</span>
                    </td>
                    <td class="px-6 py-5 text-right">
                        <a href="${job.jobUrl}" target="_blank" class="inline-flex items-center gap-1.5 text-indigo-500 font-bold text-sm hover:text-indigo-700 transition-colors">
                            Apply
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                        </a>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('tabTopPicks').onclick = () => {
            activeTab = 'topPicks';
            document.getElementById('tabTopPicks').classList.add('tab-active');
            document.getElementById('tabTopPicks').classList.remove('text-slate-400');
            document.getElementById('tabAllJobs').classList.remove('tab-active');
            document.getElementById('tabAllJobs').classList.add('text-slate-400');
            renderJobs();
        };

        document.getElementById('tabAllJobs').onclick = () => {
            activeTab = 'allJobs';
            document.getElementById('tabAllJobs').classList.add('tab-active');
            document.getElementById('tabAllJobs').classList.remove('text-slate-400');
            document.getElementById('tabTopPicks').classList.remove('tab-active');
            document.getElementById('tabTopPicks').classList.add('text-slate-400');
            renderJobs();
        };

        document.getElementById('strictToggle').onclick = () => {
            isStrictMode = !isStrictMode;
            const toggle = document.getElementById('strictToggle');
            const knob = document.getElementById('strictToggleKnob');
            
            if (isStrictMode) {
                toggle.classList.replace('bg-slate-300', 'bg-indigo-600');
                knob.classList.replace('left-1', 'left-4');
            } else {
                toggle.classList.replace('bg-indigo-600', 'bg-slate-300');
                knob.classList.replace('left-4', 'left-1');
            }
            renderJobs();
        };
    </script>
</body>
</html>
